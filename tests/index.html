<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Math Magic — Test Suite</title>
    <link rel="stylesheet" href="qunit/qunit.css" />
  </head>
  <body>
    <div id="qunit"></div>
    <div id="qunit-fixture"></div>
    <script src="qunit/qunit.js"></script>
    <script>
      // Flag read by the headless CI runner (tools/run-qunit-ci.js) to know when
      // the suite has finished and whether it passed.
      window.qunitDone = null;
      QUnit.done((result) => {
        window.qunitDone = result;
      });
    </script>

    <script type="module" src="core/rng.test.js"></script>
    <script type="module" src="core/problemGenerator.test.js"></script>

    <script type="module" src="core/importExport.test.js"></script>
    <script type="module" src="core/scoring.test.js"></script>
    <script type="module" src="core/wordProblemTemplateEngine.test.js"></script>
    <script type="module" src="core/wordProblemPatterns.test.js"></script>
    <script type="module" src="core/wordListStore.test.js"></script>
    <script type="module" src="core/wordProblemTemplateStore.test.js"></script>
    <script type="module" src="core/helpRegistry.test.js"></script>
    <script type="module" src="core/generatorHelp.test.js"></script>
    <script type="module" src="generators/fractionsDecimals.test.js"></script>

    <script type="module" src="skills/multiplicationTables.test.js"></script>

</html>
