<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Math Magic — Progress</title>
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png" />
    <link rel="shortcut icon" href="assets/favicon.ico" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <nav id="site-nav"></nav>

    <main class="container">
      <h1>Progress Dashboard <span id="dashboard-profile-name" class="dashboard-profile-name"></span></h1>

      <div id="dashboard-empty" class="card" hidden>
        <p>No quizzes taken yet. <a href="quiz.html">Take a quiz</a> to start seeing your progress here!</p>
      </div>

      <div id="dashboard-content">
        <div id="stat-grid" class="stat-grid"></div>

        <section class="card">
          <h2>Accuracy by Topic</h2>
          <p>Weakest topics are listed first, so it's easy to see where to focus practice.</p>
          <div id="accuracy-by-topic-chart" class="chart-container"></div>
        </section>

        <section class="card">
          <h2>Accuracy Over Time</h2>
          <div class="dashboard-filters">
            <label for="trend-topic-select">Topic</label>
            <select id="trend-topic-select"></select>
          </div>
          <div id="trend-chart" class="chart-container"></div>
        </section>
      </div>
    </main>

    <script src="js/vendor/d3.v7.min.js"></script>
    <script type="module">
      import { init } from './js/views/dashboardView.js';
      init();
    </script>
  </body>
</html>
