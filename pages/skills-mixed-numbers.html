<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Math Magic — Mixed Numbers</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/images/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png" />
    <link rel="shortcut icon" href="../assets/favicon.ico" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/screen.css" />
  </head>
  <body>
    <nav id="site-nav"></nav>

    <main class="container">
      <h1>Mixed Numbers &amp; Improper Fractions</h1>
      <p class="progress-text">Pick a denominator range, then convert each number — answer by clicking a choice or pressing 1, 2, 3, or 4.</p>

      <section id="skill-setup" class="card">
        <div class="field-row">
          <label for="denominator-input">Denominator(s)</label>
          <input id="denominator-input" type="text" autocomplete="off" value="2-12" placeholder="e.g. 5 or 2-12 or 3,5-8" />
        </div>

        <div class="field-row">
          <label for="skill-count-select">Number of Questions</label>
          <select id="skill-count-select">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="15">15</option>
            <option value="20">20</option>
          </select>
        </div>

        <div class="field-row">
          <label for="blitz-toggle">
            <input type="checkbox" id="blitz-toggle" />
            ⚡ Blitz Mode (60 seconds, unlimited questions)
          </label>
        </div>

        <p id="skill-setup-error" class="feedback incorrect" hidden></p>

        <button id="skill-start-btn" type="button" class="btn">Start Practice</button>
      </section>

      <section id="skill-active" class="card" hidden>
        <p id="skill-progress-text" class="progress-text"></p>
        <p id="skill-timer-text" class="progress-text" hidden></p>
        <p id="skill-equation" class="equation-display"></p>

        <div id="skill-choices" class="choice-grid"></div>

        <div id="skill-feedback" class="feedback" hidden></div>
      </section>

      <section id="skill-results" class="card" hidden>
        <h2>Practice Results</h2>
        <img id="skill-celebration-image" class="celebration-image" alt="" hidden />
        <p id="skill-score-summary"></p>
        <button id="skill-retry-btn" type="button" class="btn">Practice Again</button>
        <button id="skill-back-btn" type="button" class="btn secondary">Back to Setup</button>
        <a href="../index.html" class="btn secondary">Back to Home</a>
      </section>
    </main>

    <script type="module">
      import { init } from '../js/views/mixedNumbersView.js';
      init();
    </script>
  </body>
</html>
