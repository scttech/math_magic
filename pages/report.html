<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Math Magic — Weekly Report</title>
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="../assets/images/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png" />
    <link rel="shortcut icon" href="../assets/favicon.ico" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/screen.css" />
    <link rel="stylesheet" href="../css/print.css" media="print" />
  </head>
  <body>
    <nav id="site-nav" class="screen-only"></nav>

    <main class="container">
      <h1 class="screen-only">Weekly Progress Report</h1>
      <p class="progress-text screen-only">A one-page summary of the last 7 days, covering every profile in this browser.</p>

      <div class="toolbar screen-only">
        <button id="print-report-btn" type="button" class="btn">Print / Save as PDF</button>
      </div>

      <div id="report-empty" class="card" hidden>
        <p>No profiles have practiced in the last 7 days yet.</p>
      </div>

      <div id="report-sheet" class="report-sheet card">
        <header class="worksheet-header">
          <h2>Math Magic — Weekly Progress Report</h2>
          <p id="report-date-range" class="worksheet-meta"></p>
        </header>
        <div id="report-profiles"></div>
      </div>
    </main>

    <script type="module">
      import { init } from '../js/views/reportView.js';
      init();
    </script>
  </body>
</html>
